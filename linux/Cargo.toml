[package]
name = "steery-adapter-linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's official adapter for Linux: it starts, finds and signals processes, and plans a systemd user service."

[dependencies]
steery-sdk = { path = "/root/wt/steery-sdk-20261009/crates/steery-sdk" }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }

# Its own workspace, so it builds alone.
[workspace]
